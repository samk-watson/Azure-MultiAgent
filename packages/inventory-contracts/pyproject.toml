[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-multiagent-inventory-contracts"
version = "0.1.0"
description = "Versioned shared request and result contracts for the Inventory Agent"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.12,<3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
