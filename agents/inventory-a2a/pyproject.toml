[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-multiagent-inventory-a2a"
version = "0.1.0"
description = "A2A 1.0 server adapter for the deterministic Inventory Agent"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]==1.3.0",
    "azure-multiagent-inventory-agent==0.1.0",
    "pydantic>=2.12,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<1"]

[project.scripts]
inventory-a2a = "inventory_a2a_server.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
