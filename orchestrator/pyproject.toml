[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-multiagent-orchestrator-a2a"
version = "0.1.0"
description = "Deterministic LangGraph supply-chain orchestrator with A2A client and specialist registry"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk==1.3.0",
    "azure-multiagent-inventory-contracts==0.1.0",
    "httpx>=0.27,<1",
    "langgraph==1.2.4",
    "langgraph-checkpoint==4.3.2",
    "langgraph-checkpoint-postgres==3.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<1",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
supply_chain_orchestrator = ["migrations/*.sql"]

[project.scripts]
supply-chain-orchestrator = "supply_chain_orchestrator.runner:main"
supply-chain-orchestrator-checkpoint-bootstrap = "supply_chain_orchestrator.provisioning:checkpoint_bootstrap_main"
supply-chain-orchestrator-ledger-bootstrap = "supply_chain_orchestrator.provisioning:ledger_bootstrap_main"
supply-chain-orchestrator-provision = "supply_chain_orchestrator.provisioning:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
