[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-multiagent-inventory-agent"
version = "0.1.0"
description = "Deterministic LangGraph Inventory specialist using the Inventory MCP server"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.5,<5",
    "httpx2>=2.10,<3",
    "langgraph==1.2.4",
    "mcp==2.3.0",
    "pydantic>=2.12,<3",
    "azure-multiagent-inventory-contracts==0.1.0",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<1"]

[project.scripts]
inventory-agent = "inventory_agent.runner:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
