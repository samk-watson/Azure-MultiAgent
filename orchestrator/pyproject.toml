[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-multiagent-orchestrator-a2a"
version = "0.1.0"
description = "A2A client and specialist registry for the supply-chain orchestrator"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk==1.3.0",
    "azure-multiagent-inventory-contracts==0.1.0",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<1",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
